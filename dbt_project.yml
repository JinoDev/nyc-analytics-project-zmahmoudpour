name: 'nyc_analytics'
version: '1.0.0'
config-version: 2
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  nyc_analytics:
    +materialized: table

    assignment_work:
      +enabled: false
      staging:
        +schema: nyc_homework_staging
      marts:
        +schema: nyc_homework_warehouse_marts

    group_work:
      staging:
        +materialized: table
        +schema: cis9440_group5_staging
      marts:
        +materialized: table
        +schema: cis9440_group5_warehouse_marts
